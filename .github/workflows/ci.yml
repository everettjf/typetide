name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branding:
    name: Brand consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy brand references
        shell: bash
        run: |
          if git grep -ni -E 'say[pP]ick|say[[:space:]]+pick' -- ':!AGENTS.md'; then
            echo "Legacy product name found; use TypeTide everywhere."
            exit 1
          fi

  windows:
    name: Windows build + self-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
        working-directory: windows
      - name: Build
        run: cmake --build build --config Release
        working-directory: windows
      - name: Self-test
        shell: pwsh
        run: |
          # GUI 子系统 exe：& 调用不等待、$LASTEXITCODE 不更新，必须 Start-Process -Wait
          $env:TYPETIDE_DATA_DIR = "$env:RUNNER_TEMP\typetide-ci"
          $p = Start-Process -FilePath windows\build\Release\TypeTide.exe `
              -ArgumentList '--selftest' -NoNewWindow -Wait -PassThru
          exit $p.ExitCode

      - name: Verify shared version metadata
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not (Select-String -Quiet -Path windows/CMakeLists.txt -Pattern "project\(TypeTide VERSION $([regex]::Escape($version)) ")) {
            throw "windows/CMakeLists.txt does not match VERSION=$version"
          }
          [xml](Get-Content windows/src/TypeTide.manifest -Raw) | Out-Null

  macos:
    name: macOS unit + end-to-end tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Metal compiler for MLX
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: XCTest (unsigned)
        run: |
          xcodebuild -project TypeTide.xcodeproj -scheme TypeTide \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TypeTideDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= test
        working-directory: macos

      - name: Static analysis
        run: |
          xcodebuild -project TypeTide.xcodeproj -scheme TypeTide \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TypeTideDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= analyze
        working-directory: macos
